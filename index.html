<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nita Style</title><link rel="stylesheet" href="styles.css"></head><body onload="init()">
<main><section class="hero hero-buttons-only"><div class="hero-panel"><div class="hero-content"><a class="btn" href="shop.html">SHOP NOW</a></div></div><div class="hero-panel"><div class="hero-content"><a class="btn light" href="collections.html">NEW COLLECTION</a></div></div></section>
<div class="category-strip"><a class="cat" href="shop.html?cat=Dresses"><div class="cat-bubble"></div><span>DRESSES</span></a><a class="cat" href="shop.html?cat=Tops"><div class="cat-bubble"></div><span>TOPS</span></a><a class="cat" href="shop.html?cat=Pants"><div class="cat-bubble"></div><span>PANTS</span></a><a class="cat" href="shop.html?cat=Jackets"><div class="cat-bubble"></div><span>JACKETS</span></a><a class="cat" href="shop.html?cat=Accessories"><div class="cat-bubble"></div><span>ACCESSORIES</span></a></div>
<section class="section trending-section"><div class="section-head"><h2>Trending now</h2><a href="shop.html">View all</a></div><div class="grid" id="products"></div></section>
<section class="new-arrivals-scroll"><div class="section-head new-arrivals-head"><h2>New arrivals</h2><a href="shop.html">View all</a></div><div class="marquee product-marquee" id="newArrivalsMarquee"></div></section>
<section class="banner banner-photo"><div class="banner-overlay"><a class="btn" href="collections.html">EXPLORE COLLECTIONS</a></div></section></main>
<div id="signupPopup" class="popup"><button class="close" onclick="this.parentElement.classList.remove('show');localStorage.setItem('nitaPopupSeen','1')">×</button><h3>Get 10% off your first order</h3><p class="muted">Sign up and receive a one-time code for checkout.</p><input id="popupEmail" class="field" placeholder="Email address"><button class="btn" onclick="popupSignup()">GET MY CODE</button></div>

<script src="products.js"></script><script src="script.js"></script><script>
function renderHomeSections(){
  const products = getProducts();
  renderProducts('#products', products.slice(0,4));
  const marquee = document.getElementById('newArrivalsMarquee');
  if(marquee){
    const list = products.slice(0,6);
    marquee.innerHTML = [...list,...list].map(p => productCard(p)).join('') || '<p class="muted">No products listed yet.</p>';
  }
}
window.addEventListener('nita-store-ready', renderHomeSections);
window.addEventListener('load', () => setTimeout(renderHomeSections, 700));
</script></body></html>
