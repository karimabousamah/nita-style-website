<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Nita Style</title><link rel="stylesheet" href="styles.css?v=qv-center-only-20260612-1300"><link rel="preload" href="styles.css?v=qv-center-only-20260612-1300" as="style"><link rel="preload" href="assets/logo-cropped.png" as="image"></head><body onload="init().then(()=>shopPage())"><main class="page"><div class="shop-tools"><h1>Shop</h1><select id="filter" class="field" style="width:220px" onchange="shopPage()"><option>All</option><option>Dresses</option><option>Tops</option><option>Pants</option><option>Jackets</option><option>Accessories</option></select></div><div class="grid" id="products"></div></main><script src="products.js?v=timer-visible-smooth-marquee-20260611-1625" defer></script><script src="script.js?v=timer-visible-smooth-marquee-20260611-1625" defer></script><script>function shopPage(){let url=new URL(location.href);let cat=url.searchParams.get('cat')||document.getElementById('filter')?.value||'All'; if(document.getElementById('filter'))filter.value=cat;let list=getProducts().filter(p=>cat==='All'||p.category===cat);renderProducts('#products',list)}</script></body></html>
