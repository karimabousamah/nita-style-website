<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Nita Style</title><link rel="stylesheet" href="styles.css"></head><body onload="init().then(()=>productPage())"><main class="page"><div class="product-detail" id="detail"></div></main><script src="products.js"></script><script src="script.js"></script><script>let selectedSize='M';let selectedPhoto=0;function bg(u){return u&&u.startsWith('data:')?`background-image:url(${u});background-size:cover;background-position:center`:`background:${u||'linear-gradient(135deg,#fff,#ddd)'}`}function productPage(){let id=new URL(location.href).searchParams.get('id')||'p1';let p=getProducts().find(x=>x.id===id)||getProducts()[0];p=normalizeProductStatus(p);let photos=(p.photos&&p.photos.length?p.photos:[p.img]);selectedSize=selectedSize&&p.sizes.includes(selectedSize)?selectedSize:p.sizes[0];selectedPhoto=Math.min(selectedPhoto,photos.length-1);const canBuy=p.status==='in-stock';const action=canBuy?`<button class="btn" onclick="addToCart('${p.id}',selectedSize)">ADD TO CART</button><a class="btn light" href="checkout.html" style="margin-left:10px">BUY NOW</a>`:`<button class="btn disabled" disabled>${p.status==='coming-soon'?'COMING SOON':'OUT OF STOCK'}</button>`;detail.innerHTML=`<div><div class="detail-img" style="${bg(photos[selectedPhoto])}"></div><div class="product-thumbs">${photos.map((ph,i)=>`<button class="${i===selectedPhoto?'active':''}" onclick="selectedPhoto=${i};productPage()" style="${bg(ph)}"></button>`).join('')}</div></div><div><p class="muted">${p.category}</p><h1>${p.name}</h1><h2>${p.salePrice?`<span class='muted' style='text-decoration:line-through;font-size:20px;margin-right:10px'>${money(p.price)}</span><span class='price-drop'>${money(p.salePrice)}</span>`:money(p.price)}</h2>${stockStatusHtml(p.status)}<p>${p.desc}</p><div class="sizes">${p.sizes.map(s=>`<span class="size ${s===selectedSize?'active':''}" onclick="selectedSize='${s}';productPage()">${s}</span>`).join('')}</div>${action}<hr><p class="muted">Cash on delivery available. Online payment will be available soon.</p></div>`}</script></body></html>
